# Deadsimple Multi-Backend Configuration
# ================================
# This file defines available backends and sets the default.
# Backends are processed in order of priority; the first available one is used.

[default]
# The default backend to use when no explicit backend is specified
backend = markitdown

[backends]
# List of available backends
# NOTE: Only markitdown is currently installed and enabled by default.
# ocrflux, doclings, docstrange, and marker can be added later by installing them via pip
available = markitdown,ocrflux,doclings,docstrange,marker

[backends.markitdown]
enabled = true
description = Default markdown processing backend

[backends.ocrflux]
enabled = false
description = OCR backend (pending: pip install ocrflux)

[backends.doclings]
enabled = false
description = Doclings backend (pending: pip install doclings)

[backends.docstrange]
enabled = false
description = Docstrange backend (pending: pip install docstrange)

[backends.marker]
enabled = false
description = Marker backend (pending: pip install marker)
