[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deadsimple"
version = "0.1.0"
description = "Dead simple document processing with multiple backend support"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "markitdown>=0.1.1",
    "pdf-to-markdown>=0.1.2",
    "python-dotenv>=1.0.1",
    "openai>=1.60.0",
]

[project.optional-dependencies]
doclings = [
    "doclings>=0.7.0",
]
ocrflux = [
    "ocrflux>=2.0.0",
]
docstrange = [
    "docstrange>=1.5.0",
]
marker = [
    "marker>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["main.py", "backend.py", "process.py", "backend/*.py"]
